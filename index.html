<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Анкета — сайт для компьютерного класса</title>
  <meta name="description" content="Анкета для учеников: ответь на вопросы — и сайт компьютерного класса соберётся сам.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/exam.css">
</head>
<body>
  <div class="ink-progress" aria-hidden="true"><div class="ink-progress__bar" id="inkBar"></div></div>

  <nav class="sheet-tabs" id="sheetTabs" aria-label="Листы анкеты"></nav>

  <main class="stack" id="stack"></main>

  <aside class="sticky-note" id="stickyNote" aria-label="Предпросмотр сайта">
    <div class="sticky-note__tape" aria-hidden="true"></div>
    <p class="sticky-note__title">Так сейчас выглядит сайт</p>
    <div class="sticky-note__frame">
      <iframe id="previewFrame" title="Предпросмотр сайта класса" src="site.html?embed=1" tabindex="-1" loading="lazy"></iframe>
    </div>
    <a class="sticky-note__link" id="previewLink" href="site.html" target="_blank" rel="noopener">Открыть сайт целиком ↗</a>
  </aside>

  <script src="config.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/send.js"></script>
  <script src="js/exam.js"></script>
</body>
</html>
